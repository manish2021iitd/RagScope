[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ragscope"
dynamic = ["version"]
description = "See inside your RAG pipeline: which chunks were retrieved, which the answer used, and which claims aren't supported."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["rag", "llm", "retrieval", "hallucination", "debugging", "observability", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ragscope = "ragscope.cli:main"

[project.urls]
Homepage = "https://github.com/manish2021iitd/RagScope"
Issues = "https://github.com/manish2021iitd/RagScope/issues"

[tool.hatch.version]
path = "ragscope/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["ragscope", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q --doctest-modules"
testpaths = ["tests", "ragscope"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B905"]  # long lines live in the embedded HTML/CSS template
